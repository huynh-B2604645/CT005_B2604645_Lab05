<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhiệm vụ 2.2 — Infographic và video</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px;
      font-family: Arial, sans-serif;
      color: #203047;
      background: #f2f6fb;
    }
    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px #20304718;
    }
    h1 { margin: 0 0 10px; color: #1559a6; }
    .intro { margin: 0 0 28px; line-height: 1.6; color: #526176; }
    h2 { margin: 26px 0 12px; font-size: 1.25rem; }
    .infographic {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .document {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 420px;
      border: 1px solid #d8e0e9;
      border-radius: 10px;
    }
    .video {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e4eaf1;
      color: #68778b;
      font-size: .9rem;
    }
    @media (max-width: 600px) {
      body { padding: 16px 10px; }
      main { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nhiệm vụ 2.2: Infographic và video</h1>
      <p class="intro">Xem infographic và video được nhúng từ YouTube.</p>
    </header>


    <section aria-labelledby="infographic-title">
      <h2 id="infographic-title">Infographic</h2>
      <img class="infographic" src="./Lab5_Ex2.1.png" alt="Infographic của bài tập Lab05, nhiệm vụ 2.1">
    </section>

    <section aria-labelledby="video-title">
      <h2 id="video-title">Video YouTube</h2>
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/rKBaqzMRH9o"
          title="Video short trên YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>
    <footer>© Nội dung infographic thuộc về chủ sở hữu Canva AI. Video được nhúng từ YouTube; mọi quyền thuộc về chủ sở hữu bản quyền.</footer>
  </main>
</body>
</html>
